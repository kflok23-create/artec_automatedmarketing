# CI runs lint, tests, the mocked full cycle, migrations against a throwaway Postgres,
# and a secret scan. CI NEVER deploys — Railway auto-deploys on push to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hermes" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Secret scan
        run: |
          ! grep -rInE "(sk-ant-api[0-9A-Za-z_-]{10,}|whsec_[0-9A-Za-z]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|[0-9]{8,10}:AA[0-9A-Za-z_-]{30,})" \
            --exclude-dir=.git --exclude-dir=.venv --exclude=ci.yml .
      - name: Unit + acceptance tests
        run: uv run pytest
      - name: Mocked full cycle
        run: uv run hermes cycle --dry-run
        env:
          DATABASE_URL: sqlite://
          HERMES_API_TOKEN: ci-token
          ANTHROPIC_API_KEY: ci
          ANTHROPIC_MODEL: ci
          FAL_KEY: ci
          GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ci
          GOOGLE_SHARED_DRIVE_ID: ci
          UPLOAD_POST_API_KEY: ci
          UPLOAD_POST_USER: ci
          BREVO_API_KEY: ci
          BREVO_LIST_ID: "3"
          BREVO_SENDER_EMAIL: ci@example.com
          BREVO_TEMPLATE_ID: "3"
          TELEGRAM_BOT_TOKEN: ci
          TELEGRAM_CHAT_ID: "1"
          STRIPE_SECRET_KEY: ci
          STRIPE_WEBHOOK_SECRET: ci
          BILLPLZ_API_KEY: ci
          BILLPLZ_COLLECTION_ID: ci
          BILLPLZ_XSIGNATURE_KEY: ci
      - name: Migrations against throwaway Postgres
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://hermes:hermes@localhost:5432/hermes_ci
