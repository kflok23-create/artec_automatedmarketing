# hermes-agent plugin manifest — layout and fields per
# https://hermes-agent.nousresearch.com/docs/developer-guide/plugins
# Deployed to $HERMES_HOME/plugins/artec/ (flat layout, within the one-level nesting max).
# Discovery requires this file AND __init__.py with register(ctx); enablement is opt-in:
#   hermes plugins enable artec
name: artec
version: 0.4.0
description: >
  The artec marketing seam - fifteen tools. Six reads (brief, learnings, asset inventory,
  parked posts, draft posts, digest) and nine narrow writes (plan, gate decision, video
  delivery + review, email review, metric transcription, retry, wishlist fulfilment, price
  acknowledgement). No tool writes orders, events or config; metrics are writable by
  TRANSCRIPTION ONLY, and every submitted digit must appear in the operator's verbatim
  message. The capability boundary is the security model.
provides_tools:
  - read_brief
  - read_learnings
  - read_asset_inventory
  - read_parked_posts
  - read_draft_posts
  - read_digest
  - write_plan
  - record_gate_decision
  - deliver_video
  - review_video
  - review_email
  - record_metrics
  - retry_post
  - fulfil_wishlist
  - acknowledge_price_table
provides_hooks:
  - pre_tool_call
requires_env:
  - name: DATABASE_URL
    description: "Railway Postgres (reference variable); the only credential this plugin touches"
    secret: true
