[alembic]
# Migrations live INSIDE the app package so the wheel ships them and runtime head checks
# resolve from site-packages (app.db.script_head_revision). This ini is only needed by the
# alembic CLI (pre-deploy upgrade, CI), which runs from the repo root.
script_location = app/migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally absent — migrations/env.py reads DATABASE_URL from the
# environment at runtime. Never hardcode a connection string in the repo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
