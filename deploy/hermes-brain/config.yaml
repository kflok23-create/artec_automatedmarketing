# hermes-agent profile 'artec' — VERIFIED KEYS ONLY.
# Every block cites the doc it was verified against; nothing here is invented.
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/configuration

# Provider/model — verified: /docs/user-guide/configuration (Provider & Model Selection).
# With provider anthropic the model id must be BARE — vendor-prefixed slugs
# (anthropic/claude-…) belong to aggregators like openrouter and break LLM calls here.
model:
  provider: anthropic
  default: claude-opus-5

# Redaction — verified verbatim: /docs/user-guide/configuration (Security & Privacy)
security:
  redact_secrets: true
privacy:
  redact_pii: true

# Plugin enablement — verified: /docs/user-guide/configuration (Plugins Enablement).
# Belt AND braces: the entrypoint also runs `hermes plugins enable artec` (plugins are
# opt-in and will not load without enablement).
plugins:
  entries:
    - name: "artec"
      enabled: true

# Per-profile tool disable — key verified in the docs AND the mechanism verified
# EMPIRICALLY against a real hermes-agent install (`hermes tools --summary` drops to the
# allowed set with this block in place). Target state: artec plus the minimum to read a
# brief and write a plan — nothing that generates media, writes files, runs shell, or
# spawns subagents. The inert-by-missing-dependency toolsets (bfl, browser, browser-cdp,
# computer_use, image_gen, video_gen) are disabled EXPLICITLY so a future image change
# cannot switch them on silently. 'todo'/'kanban' are the same board under different ids
# across agent versions — both listed. The plugin's pre_tool_call hook blocks the
# shell/file families again as defense in depth.
agent:
  disabled_toolsets:
    - terminal
    - code_execution
    - file
    - delegation
    - video
    - project
    - todo
    - kanban
    - tts
    - bfl
    - browser
    - browser-cdp
    - computer_use
    - image_gen
    - video_gen

# Telegram-facing toolsets — key verified (/docs/user-guide/configuration,
# platform_toolsets): the six artec tools, conversation helpers, and memory/skills for
# the learning behaviours. web = search/scraping only (trend scouting), not a browser.
platform_toolsets:
  telegram:
    - artec
    - clarify
    - memory
    - skills
    - session_search
    - web

# NOT in this file, by documented design:
# - TELEGRAM_BOT_TOKEN / credentials → profile .env via `hermes config set` (entrypoint)
# - cron jobs → `hermes cron create` (entrypoint registers the two Sunday jobs;
#   storage is $HERMES_HOME/cron/jobs.json — never patched directly)
# - allowed-chat whitelist → configure per /docs/user-guide/messaging/telegram on first
#   boot (NOT VERIFIED in this build; the docs page exists but was not fetched)
