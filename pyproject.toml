[project]
name = "hermes"
version = "0.1.0"
description = "HERMES — one agent, one store, one key. Manual marketing loop for artec.my."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "pillow>=10.3",
    "ffmpeg-python>=0.2.0",
    "anthropic>=0.34",
    "fal-client>=0.4",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
hermes = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
