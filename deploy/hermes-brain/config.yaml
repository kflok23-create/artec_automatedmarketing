# hermes-agent profile 'artec' — VERIFIED KEYS ONLY.
# Every block cites the doc it was verified against; nothing here is invented.
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/configuration

# Provider/model — verified: /docs/user-guide/configuration (Provider & Model Selection)
model:
  provider: anthropic
  default: anthropic/claude-opus-5

# Redaction — verified verbatim: /docs/user-guide/configuration (Security & Privacy)
security:
  redact_secrets: true
privacy:
  redact_pii: true

# Plugin enablement — verified: /docs/user-guide/configuration (Plugins Enablement).
# Belt AND braces: the entrypoint also runs `hermes plugins enable artec` (plugins are
# opt-in and will not load without enablement).
plugins:
  entries:
    - name: "artec"
      enabled: true

# Per-profile tool disable — verified: /docs/user-guide/configuration
# (agent.disabled_toolsets) + toolset names from /docs/reference/toolsets-reference:
#   terminal        = shell command execution
#   code_execution  = programmatic tool calls via Python
#   file            = read/write/patch/search files
# The plugin's pre_tool_call hook blocks the same names as defense in depth.
agent:
  disabled_toolsets:
    - terminal
    - code_execution
    - file

# Telegram-facing toolsets — key verified (/docs/user-guide/configuration,
# platform_toolsets); the exact value set below is our choice: the six artec tools plus
# web for trend scouting and memory/skills for the four learning behaviours.
platform_toolsets:
  telegram:
    - artec
    - web
    - memory
    - skills

# NOT in this file, by documented design:
# - TELEGRAM_BOT_TOKEN / credentials → profile .env via `hermes config set` (entrypoint)
# - cron jobs → `hermes cron create` (entrypoint registers the two Sunday jobs;
#   storage is $HERMES_HOME/cron/jobs.json — never patched directly)
# - allowed-chat whitelist → configure per /docs/user-guide/messaging/telegram on first
#   boot (NOT VERIFIED in this build; the docs page exists but was not fetched)
